name: SILENT_GHOST_VPS
on: [push, workflow_dispatch]

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 🛰️ Launching SSH Tunnel
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false # Allows you to connect from any device/Termius

      - name: ♾️ Keep Alive Loop
        run: |
          echo "VPS is live. Use the SSH link above in Termius."
          # This ensures the build doesn't end even if you disconnect
          while sleep 1; do :; done
