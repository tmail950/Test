name: SILENT_GHOST_VPS
on: [push, workflow_dispatch]

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Set up Environment
        run: |
          # Set a password for the user 'runner' so you can log in via Termius
          echo "runner:silent786" | sudo chpasswd
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo service ssh start

      - name: 🛰️ Launch Cloudflare Tunnel
        run: |
          # Install Cloudflared (The Tunnel Engine)
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          echo "========================================================="
          echo "🟢 SILENT TECH CLOUDFLARE VPS IS STARTING..."
          echo "---------------------------------------------------------"
          echo "👇 LOOK FOR THE .trycloudflare.com LINK BELOW 👇"
          echo ""
          
          # Start a quick tunnel for SSH on port 22
          # We use timeout to stop it after 6 hours
          timeout 6h cloudflared tunnel --url ssh://localhost:22
