name: IMMORTAL_VPS_24_7
on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🛠️ Setup Environment & Restore Data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@silent.tech"
          
          # 1. Create a dedicated storage folder
          mkdir -p storage
          
          # 2. Try to pull existing data from vps-data branch
          if git ls-remote --heads origin vps-data | grep vps-data; then
            git fetch origin vps-data
            git checkout origin/vps-data -- . || true
            echo "✅ Previous data restored into /storage"
          fi

      - name: 🛰️ Setup SSH & Bore
        run: |
          echo "runner:silent786" | sudo chpasswd
          sudo apt-get update && sudo apt-get install -y openssh-server wget curl
          sudo service ssh start
          wget https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

      - name: ♾️ Run & Notify Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: "8657231592:AAGvCzC0Db-vcOfAvOIsrp5U5UD_lugWVMc"
          TG_ID: "8260753436"
        run: |
          # 1. Start Bore
          ./bore local 22 --to bore.pub > bore.log 2>&1 &
          sleep 20
          
          # 2. Extract Port
          PORT=$(grep -o 'bore.pub:[0-9]*' bore.log | cut -d: -f2)
          
          if [ -z "$PORT" ]; then
            echo "❌ Bore failed. Retrying..."
            ./bore local 22 --to bore.pub > bore.log 2>&1 &
            sleep 20
            PORT=$(grep -o 'bore.pub:[0-9]*' bore.log | cut -d: -f2)
          fi
          
          # 3. Send Telegram
          MSG="🚀 *SILENT TECH VPS ONLINE*%0A━━━━━━━━━━━━━━━━━━━%0A🌐 *Host:* \`bore.pub\`%0A🔢 *Port:* \`$PORT\`%0A👤 *User:* \`runner\`%0A🔑 *Pass:* \`silent786\`%0A━━━━━━━━━━━━━━━━━━━%0A⏱️ _Auto-restart in 5h 50m_"
          curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage?chat_id=$TG_ID&text=$MSG&parse_mode=Markdown"
          
          echo "✅ Port $PORT is live. START YOUR SCRAPERS NOW."

          # 4. Wait for 5 hours and 50 mins
          sleep 21000 
          
          # 5. Backup Data (The Real Way)
          echo "💾 BACKING UP DATA TO GITHUB..."
          git checkout --orphan vps-data
          git rm -rf . --cached > /dev/null
          # Only save what is in the storage folder
          git add storage/
          git commit -m "Persistent Backup: $(date)" || true
          git push origin vps-data --force

          # 6. Reincarnation
          echo "🔄 RESTARTING WORKFLOW..."
          gh workflow run silent_vps.yml
          exit 0
