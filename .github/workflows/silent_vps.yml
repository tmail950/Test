name: SILENT_GHOST_VPS
on: 
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup SSH Server
        run: |
          # Set a password for the 'runner' user
          echo "runner:silent786" | sudo chpasswd
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo service ssh start

      - name: 🛰️ Launching Bore Tunnel
        run: |
          # Download and install Bore
          wget https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          
          echo "========================================================="
          echo "🟢 SILENT TECH VPS IS BOOTING..."
          echo "---------------------------------------------------------"
          echo "👇 LOOK FOR 'listening at bore.pub:<port>' BELOW 👇"
          echo "========================================================="
          
          # Run bore to tunnel the SSH port (22)
          ./bore local 22 --to bore.pub
