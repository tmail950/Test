name: SILENT_GHOST_VPS
on: 
  workflow_dispatch: # Allows manual start

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Install Terminal Engine
        run: |
          sudo apt-get update
          sudo apt-get install tmate -y

      - name: 🛰️ Launching SSH Session
        run: |
          # Start tmate in background
          tmate -S /tmp/tmate.sock new-session -d
          
          # Wait for the SSH string to be generated by tmate servers
          echo "⏳ Waiting for connection string..."
          while [ -z "$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')" ]; do 
            sleep 2
          done
          
          echo "========================================================="
          echo "🟢 SILENT TECH VPS IS LIVE!"
          echo "---------------------------------------------------------"
          echo "👇 COPY THIS ENTIRE LINE INTO TERMIUS 👇"
          echo ""
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          echo ""
          echo "---------------------------------------------------------"
          echo "⚠️ NO PASSWORD NEEDED | PORT IS 443"
          echo "========================================================="
          
          # Keep it alive for 6 hours
          sleep 21600
