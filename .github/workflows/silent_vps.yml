name: SILENT_GHOST_VPS
on: [push, workflow_dispatch]

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Install Tmate
        run: sudo apt-get update && sudo apt-get install tmate -y

      - name: 🛰️ Generating SSH Tunnel
        run: |
          # Start tmate in the background
          tmate -S /tmp/tmate.sock new-session -d
          
          # Wait a few seconds for the server to generate the link
          sleep 5
          
          # Get the SSH string
          SSH_LINK=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          
          echo "========================================================="
          echo "🟢 SILENT TECH VPS IS LIVE!"
          echo "---------------------------------------------------------"
          echo "👇 COPY THIS INTO TERMIUS 👇"
          echo ""
          echo "$SSH_LINK"
          echo ""
          echo "---------------------------------------------------------"
          echo "========================================================="
          
          # Keep the machine alive for 6 hours
          sleep 21600
