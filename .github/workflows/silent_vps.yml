name: IMMORTAL_VPS_24_7
on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🛠️ Restore Persistent Data
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@silent.tech"
          # Try to get data from vps-data branch
          if git ls-remote --heads origin vps-data | grep vps-data; then
            git fetch origin vps-data
            git checkout vps-data
            mkdir -p /home/runner/work_data
            cp -r . /home/runner/work_data/ || true
            git checkout main
          fi
          mkdir -p /home/runner/work_data

      - name: 🛰️ Setup SSH & Bore
        run: |
          echo "runner:silent786" | sudo chpasswd
          sudo apt-get update && sudo apt-get install -y openssh-server wget
          sudo service ssh start
          wget https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

      - name: ♾️ Run VPS & Auto-Restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Start Bore
          ./bore local 22 --to bore.pub > bore.log 2>&1 &
          
          # 2. Wait for link and print to logs
          sleep 15
          echo "========================================================="
          echo "🟢 SILENT TECH VPS IS LIVE!"
          echo "---------------------------------------------------------"
          grep -o 'bore.pub:[0-9]*' bore.log
          echo "---------------------------------------------------------"
          echo "👤 User: runner  |  🔑 Pass: silent786"
          echo "========================================================="
          
          # 3. Keep-alive for 5 hours and 50 minutes
          echo "⏳ VPS will run for 5h 50m. Scrape your shit in /home/runner/work_data/"
          sleep 21000 
          
          # 4. Save work_data back to GitHub
          echo "💾 BACKING UP DATA..."
          cd /home/runner/work_data
          git checkout -b vps-data || git checkout vps-data
          git add .
          git commit -m "Backup: $(date)" || true
          git push origin vps-data --force

          # 5. Self-Restart
          echo "🔄 TRIGGERING RESTART..."
          # This command triggers the next run automatically
          gh workflow run silent_vps.yml
          exit 0
